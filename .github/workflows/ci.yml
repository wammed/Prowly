name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-fmt:
    name: Lint & Formatting (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Verify code formatting (cargo fmt)
        run: cargo fmt --check

      - name: Run linter (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: lint-and-fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build target
        uses: Swatinem/rust-cache@v2

      - name: Typecheck and compile (cargo check)
        run: cargo check --all-targets --all-features

      - name: Run test suite (cargo test)
        run: cargo test --all-targets --all-features
